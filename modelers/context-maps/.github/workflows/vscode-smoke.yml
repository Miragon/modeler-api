# The packaged extension in a real VS Code (npm run test:vscode). Kept out of ci.yml and out of
# the required checks: it downloads VS Code and drives a desktop app, so a pull request never
# waits for it. It runs on pull requests that change the extension or the test's wiring, weekly
# to catch a new VS Code release, and on demand (Actions → VS Code smoke → Run workflow, on any
# branch).
name: VS Code smoke

on:
  pull_request:
    paths:
      - "apps/vscode/**"
      - "vitest.config.ts"
      - "package.json"
      - ".github/actions/setup/**"
      - ".github/workflows/vscode-smoke.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-smoke:
    name: VS Code ${{ matrix.vscode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # minimum: the engines.vscode floor the extension promises; stable: the newest release.
        vscode: [minimum, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Resolve the VS Code version
        id: vscode
        env:
          TRACK: ${{ matrix.vscode }}
        run: |
          if [ "$TRACK" = "minimum" ]; then
            version=$(node -p "require('./apps/vscode/package.json').engines.vscode.replace(/^\^/, '')")
          else
            version=$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')
          fi
          echo "VS Code $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The driver's download folder on Linux ($XDG_CACHE_HOME, which GitHub's runners leave unset),
      # one cache entry per version, so a new release starts a fresh one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/miragon-modeler-shell/vscode-test
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}
      - run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_SMOKE_VERSION: ${{ steps.vscode.outputs.version }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-smoke-${{ matrix.vscode }}
          path: test-results/vscode-smoke/
          retention-days: 7
