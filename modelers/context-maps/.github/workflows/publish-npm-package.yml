name: Publish npm package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory name under packages/
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 ships npm >= 11, which supports OIDC trusted publishing (tokenless).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The npm bundled with Node 24 (11.3.x) errors with "Failed to generate Web
      # Auth URLs / token is invalid" *after* a successful OIDC trusted-publish,
      # aborting the run even though the package was uploaded. Fixed in npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish @miragon/context-maps-${{ inputs.package }}
        run: |
          set -uo pipefail
          dir="packages/${{ inputs.package }}"
          name="$(node -p "require('./$dir/package.json').name")"
          version="$(node -p "require('./$dir/package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "skip $name@$version (already on registry)"
            exit 0
          fi
          echo "publish $name@$version"
          # Don't trust the exit code: the npm OIDC client can fail a post-publish
          # request after the tarball is already accepted. Verify against the
          # registry instead of relying on npm publish's exit status.
          npm publish -w "$dir" --provenance --access public || true
          # The registry can take minutes to list a version it has accepted;
          # giving up sooner turns a good release into a red run.
          # Each poll gets its own short fetch timeout and no npm retries: with
          # npm's defaults (5-minute timeout, 2 retries) one stalled npm view can
          # block far longer than the whole wait, and this loop already retries.
          poll_interval_seconds=15
          poll_timeout_seconds=300
          waited_seconds=0
          attempt=1
          until registry_answer="$(npm view "$name@$version" version --fetch-timeout=30000 --fetch-retries=0 2>&1)"; do
            if [ "$waited_seconds" -ge "$poll_timeout_seconds" ]; then
              echo "::error::$name@$version did not land on the registry after $attempt attempts, ${poll_interval_seconds}s apart"
              echo "last registry answer to npm view $name@$version version:"
              echo "$registry_answer"
              exit 1
            fi
            echo "waiting for $name@$version to appear on the registry (attempt $attempt, ${waited_seconds}s of ${poll_timeout_seconds}s)"
            sleep "$poll_interval_seconds"
            waited_seconds=$((waited_seconds + poll_interval_seconds))
            attempt=$((attempt + 1))
          done
          echo "confirmed $name@$version on registry"
