name: Publish npm package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory name under packages/
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Node 24 ships npm >= 11, which supports OIDC trusted publishing (tokenless).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The npm bundled with Node 24 (11.3.x) errors with "Failed to generate Web
      # Auth URLs / token is invalid" *after* a successful OIDC trusted-publish,
      # aborting the run even though the package was uploaded. Fixed in npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish @miragon/context-maps-${{ inputs.package }}
        run: |
          set -uo pipefail
          dir="packages/${{ inputs.package }}"
          name="$(node -p "require('./$dir/package.json').name")"
          version="$(node -p "require('./$dir/package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "skip $name@$version (already on registry)"
            exit 0
          fi
          echo "publish $name@$version"
          # Don't trust the exit code: the npm OIDC client can fail a post-publish
          # request after the tarball is already accepted. Verify against the
          # registry instead of relying on npm publish's exit status.
          npm publish -w "$dir" --provenance --access public || true
          published=""
          for attempt in 1 2 3 4 5 6; do
            if npm view "$name@$version" version > /dev/null 2>&1; then
              published=1
              break
            fi
            echo "waiting for $name@$version to appear on the registry (attempt $attempt)"
            sleep 5
          done
          if [ -z "$published" ]; then
            echo "::error::$name@$version did not land on the registry"
            exit 1
          fi
          echo "confirmed $name@$version on registry"
