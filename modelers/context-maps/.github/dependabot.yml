version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # @types/vscode must stay <= engines.vscode (^1.96.0) or `vsce package` fails.
    ignore:
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # typescript-eslint caps its typescript peer range at <6.1.0; TypeScript 7 breaks `npm ci`.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # The shared modeler contract and chrome change what users see and what the release says;
      # they come in a PR of their own, never auto-merged (see dependabot-automerge.yml), and are
      # landed as `fix(deps): adopt modeler-shell x.y` so release-please releases them.
      modeler-platform:
        applies-to: version-updates
        patterns:
          - "@miragon/modeler-*"
      # Majors get their own PR so breaking changes never hide inside a routine bump.
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@miragon/modeler-*"
        update-types:
          - "patch"
          - "minor"
      npm-major:
        patterns:
          - "*"
        exclude-patterns:
          - "@miragon/modeler-*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
