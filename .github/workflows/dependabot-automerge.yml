name: Dependabot auto-merge

# A run Dependabot starts on pull_request gets Dependabot secrets only, without the app's key.
# pull_request_target runs this file as it is on main, with the Actions secrets, so it never checks
# out or runs code of the pull request. GitHub blocks pull_request_target in public repositories
# unless an Actions policy (Settings → Actions → Policies) allows it for this workflow.
on: pull_request_target

permissions:
  pull-requests: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub merges in the name of whoever enabled auto-merge, and a merge made with GITHUB_TOKEN
      # starts no workflow on main: no ci-ok, no CodeQL, no release-please.
      - name: Create a release-please app token for patch and minor updates
        id: app-token
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        if: steps.app-token.outcome == 'success'
        run: |
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash "$PR_URL" && exit 0
            echo "enablePullRequestAutoMerge race (attempt $i) — retrying in 15s…"
            sleep 15
          done
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
