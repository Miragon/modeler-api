name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # one output per workspace package — release-please reports each path as
    # `<path>--release_created`, so a release of one package never publishes another
    outputs:
      api_release_created: ${{ steps.release_please.outputs['packages/api--release_created'] }}
      shell_release_created: ${{ steps.release_please.outputs['packages/shell--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release_please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm-api:
    needs: release-please
    if: needs.release-please.outputs.api_release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_DIR: packages/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the shared setup action, on Node 24: it ships npm >= 11.5.1 with OIDC
      # trusted publishing (tokenless) — ONE setup-node pin for the whole repo
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm run build -w "$PACKAGE_DIR"
      - run: npm run publint -w "$PACKAGE_DIR"
      - name: Publish @miragon/modeler-api
        run: |
          name="$(node -p "require('./$PACKAGE_DIR/package.json').name")"
          version="$(node -p "require('./$PACKAGE_DIR/package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            npm publish -w "$PACKAGE_DIR"
          fi

  publish-npm-shell:
    needs: release-please
    if: needs.release-please.outputs.shell_release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_DIR: packages/shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the shared setup action, on Node 24: it ships npm >= 11.5.1 with OIDC
      # trusted publishing (tokenless) — ONE setup-node pin for the whole repo
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm run build -w "$PACKAGE_DIR"
      - run: npm run publint -w "$PACKAGE_DIR"
      - name: Publish @miragon/modeler-shell
        run: |
          name="$(node -p "require('./$PACKAGE_DIR/package.json').name")"
          version="$(node -p "require('./$PACKAGE_DIR/package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            npm publish -w "$PACKAGE_DIR"
          fi
